# AVADESK — nginx do serviço "web": SPA + proxy /api -> api:3000 (mesma origem, exigida por passkeys).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;   # backups/imports em JSON
    server_tokens off;
    # Segurança: o nginx NÃO herda add_header do server quando o location define o seu próprio;
    # por isso security-headers.inc é incluído também em cada location com add_header.
    include /etc/nginx/conf.d/security-headers.inc;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Mídia de exercícios (volume ./media) — imutável, cache longo
    location ~ ^/(img|gif)/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets com hash do Vite
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker e manifest nunca em cache, para atualizações chegarem
    location = /sw.js { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Rotas da SPA
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}